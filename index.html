<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Interactive Painting — 3D</title>
<style>
  html, body { margin:0; padding:0; background:#1c1c1c; overflow:hidden;
               overscroll-behavior:none; height:100%; }
  canvas { display:block; touch-action:none; }

  #preload {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#8a8a8a; font-family:-apple-system, sans-serif; font-size:13px;
    letter-spacing:0.04em; background:#1c1c1c; z-index:1200;
  }

  /* quiet chrome, bottom right, always available */
  #viewTools {
    position:fixed; right:12px; bottom:12px; display:flex; gap:8px; z-index:900;
  }
  #viewTools button {
    background:rgba(0,0,0,0.45); color:#c9a45c; border:1px solid rgba(201,164,92,0.35);
    font-family:-apple-system, sans-serif; font-size:12px; padding:7px 11px;
    border-radius:3px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  #viewTools button:hover { background:rgba(0,0,0,0.7); }

  /* positioning mode — only with ?edit=1 */
  #editBar {
    position:fixed; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.85); color:#fff;
    font-family:-apple-system, sans-serif; font-size:13px;
    padding:10px 14px 14px; display:none; align-items:center; gap:10px;
    z-index:999; flex-wrap:wrap;
  }
  #editBar.active { display:flex; }
  #editBar button {
    background:#c9a45c; border:none; color:#111; padding:8px 12px;
    border-radius:4px; font-size:13px; font-weight:600; cursor:pointer;
  }
  #editBar .sel { color:#c9a45c; font-weight:600; min-width:92px; }
  #editBar .grp { display:flex; gap:6px; align-items:center; }
  #editBar .lbl { opacity:0.55; font-size:12px; }
  #layoutOut {
    position:fixed; top:0; left:0; right:0; max-height:42vh; overflow:auto;
    background:rgba(0,0,0,0.93); color:#9fe39f;
    font-family:'SF Mono', Menlo, monospace; font-size:12px;
    padding:14px; white-space:pre-wrap; display:none; z-index:1000;
  }
  #layoutOut.active { display:block; }
</style>
</head>
<body>

<div id="preload">Loading…</div>

<div id="viewTools">
  <button onclick="resetView()">Reset view</button>
  <button onclick="toggleFullscreen()" id="fsBtn">Fullscreen</button>
</div>

<div id="editBar">
  <span class="lbl">Positioning mode</span>
  <span class="sel" id="selLabel">none selected</span>
  <span class="grp"><span class="lbl">size</span>
    <button onclick="adjustScale(-0.005)">−</button>
    <button onclick="adjustScale(0.005)">+</button></span>
  <span class="grp"><span class="lbl">depth</span>
    <button onclick="adjustDepth(-2)">−</button>
    <button onclick="adjustDepth(2)">+</button></span>
  <span class="grp"><span class="lbl">rotate</span>
    <button onclick="rotate90('x')">X</button>
    <button onclick="rotate90('y')">Y</button>
    <button onclick="rotate90('z')">Z</button></span>
  <button onclick="exportLayout()">Copy layout</button>
</div>
<pre id="layoutOut"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   CONFIG — the only section you edit per painting.
   x / y / scale are carried straight over from the 2D layout, in the
   same 700x950 canvas space. z is depth: positive comes toward viewer.
   px is the source PNG's pixel size, needed to build real geometry.
   ===================================================================== */
const CONFIG = {
  width: 700,
  height: 950,
  background: "blackpaper.png",
  backgroundZ: -70,
  backgroundOverfill: 1.08,
  defaultDepth: 18,          // wood thickness in canvas units
  pieces: [
    { id:"villalba",       src:"villalba.png",       px:[1087,1383], x:475.9, y:655.1, z:0, scale:0.200, rot:[0,0,0] },
    { id:"fishing",        src:"fishing.png",        px:[1150,1479], x:258.1, y:651.1, z:0, scale:0.200, rot:[0,0,0] },
    { id:"eyes",           src:"eyes.png",           px:[1440, 627], x:224.0, y:447.3, z:0, scale:0.200, rot:[0,0,0] },
    { id:"lightblueblock", src:"lightblueblock.png", px:[ 253, 264], x:344.1, y:818.8, z:0, scale:0.200, rot:[0,0,0], depth:14 },
    { id:"teal",           src:"teal.png",           px:[ 189, 192], x:164.8, y:370.0, z:0, scale:0.200, rot:[0,0,0], depth:14 },
    { id:"brown",          src:"brown.png",          px:[ 198, 185], x:201.8, y:369.4, z:0, scale:0.200, rot:[0,0,0], depth:14 },
    { id:"face",           src:"face.png",           px:[ 875,1889], x:451.9, y:332.2, z:0, scale:0.200, rot:[0,0,0] },
    // fish: the block is the bottom 62.8% / left 95% of the PNG. The hook
    // and line above it stay a flat plane flush with the block's front face.
    { id:"fish",           src:"fish.png",           px:[ 769,2117], x:296.7, y:174.9, z:0, scale:0.200, rot:[0,0,0],
      depth:16, split:{ blockW:0.950, blockH:0.628 } },
  ]
};
/* ===================================================================== */

const EDIT = window.location.search.includes("edit=1");

let scene, camera, renderer, raycaster, woodTex;
let groups = [], meshes = [], bgMesh = null;
let selected = null;

// camera orbit state
let orbit = { theta:0, phi:Math.PI/2, zoom:1 }, baseDist = 1200;

/* ---------- wood grain, generated so there's no extra asset to host ---------- */
function makeWoodTexture() {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 512;
  const g = c.getContext("2d");
  g.fillStyle = "#b08a5f"; g.fillRect(0,0,512,512);
  for (let i=0; i<400; i++) {
    const y = Math.random()*512;
    const dark = Math.random() < 0.5;
    g.strokeStyle = dark
      ? `rgba(${70+Math.random()*45|0},${46+Math.random()*32|0},${26+Math.random()*22|0},${0.05+Math.random()*0.16})`
      : `rgba(${225+Math.random()*25|0},${205+Math.random()*30|0},${170+Math.random()*35|0},${0.03+Math.random()*0.09})`;
    g.lineWidth = 0.4 + Math.random()*2.4;
    g.beginPath(); g.moveTo(0, y);
    for (let x=0; x<=512; x+=24) g.lineTo(x, y + Math.sin((x + i*17) * 0.013) * 3.5 + (Math.random()-0.5)*1.8);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

// grain runs along the face's long axis, scale held constant in world units
function woodMat(faceW, faceH) {
  const t = woodTex.clone(); t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(Math.max(faceW,1)/140, Math.max(faceH,1)/140);
  t.offset.set(Math.random(), Math.random());
  return new THREE.MeshLambertMaterial({ map:t });
}

/* ---------- boot ---------- */
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1c1c1c);

  camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 1, 8000);

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.78));
  const key = new THREE.DirectionalLight(0xffffff, 0.5);
  key.position.set(0.4, 0.9, 1);
  scene.add(key);

  raycaster = new THREE.Raycaster();
  woodTex = makeWoodTexture();

  loadAll();
}

function loadAll() {
  const loader = new THREE.TextureLoader();
  const srcs = CONFIG.pieces.map(p => p.src);
  if (CONFIG.background) srcs.push(CONFIG.background);

  const textures = {};
  let done = 0;
  const pre = document.getElementById("preload");

  srcs.forEach(src => {
    loader.load(src, tex => {
      tex.encoding = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      textures[src] = tex;
      if (++done === srcs.length) build(textures);
      else pre.textContent = "Loading… " + Math.round(done/srcs.length*100) + "%";
    }, undefined, () => {
      pre.textContent = "Couldn't load " + src + " — check it sits next to this file.";
    });
  });
}

function build(tex) {
  document.getElementById("preload").style.display = "none";

  if (CONFIG.background) {
    const t = tex[CONFIG.background];
    const o = CONFIG.backgroundOverfill || 1;
    bgMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(CONFIG.width*o, CONFIG.height*o),
      new THREE.MeshBasicMaterial({ map:t })
    );
    bgMesh.position.z = CONFIG.backgroundZ;
    scene.add(bgMesh);
  }

  CONFIG.pieces.forEach(p => {
    const g = p.split ? buildSplitPiece(p, tex[p.src]) : buildBoxPiece(p, tex[p.src]);
    g.position.set(p.x - CONFIG.width/2, CONFIG.height/2 - p.y, p.z || 0);
    g.rotation.set(deg(p.rot[0]), deg(p.rot[1]), deg(p.rot[2]));
    g.userData.id = p.id;
    g.userData.baseScale = p.scale;
    g.userData.scale = p.scale;
    g.userData.depth = p.depth || CONFIG.defaultDepth;
    g.userData.baseDepth = g.userData.depth;
    scene.add(g);
    groups.push(g);
    g.traverse(o => { if (o.isMesh) { o.userData.group = g; meshes.push(o); } });
  });

  if (EDIT) document.getElementById("editBar").classList.add("active");
  bindInput();
  onResize();
  window.addEventListener("resize", onResize);
  renderer.setAnimationLoop(render);
}

const deg = d => (d || 0) * Math.PI / 180;

/* ---------- a plain block ---------- */
function buildBoxPiece(p, tex) {
  const g = new THREE.Group();
  const W = p.px[0] * p.scale, H = p.px[1] * p.scale;
  const d = p.depth || CONFIG.defaultDepth;

  const face = new THREE.MeshBasicMaterial({ map:tex, transparent:true, alphaTest:0.5 });
  const lr = woodMat(d, H), tb = woodMat(W, d), back = woodMat(W, H);

  const block = new THREE.Mesh(
    new THREE.BoxGeometry(W, H, d),
    [lr, lr, tb, tb, face, back]
  );
  g.add(block);
  g.userData.block = block;
  return g;
}

/* ---------- a block with a flat extension (fish: hook + line) ---------- */
function buildSplitPiece(p, tex) {
  const g = new THREE.Group();
  const W = p.px[0] * p.scale, H = p.px[1] * p.scale;
  const d = p.depth || CONFIG.defaultDepth;
  const bw = W * p.split.blockW, bh = H * p.split.blockH;

  // block — front face UV-cropped to the painted rectangle only
  const faceTex = tex.clone(); faceTex.needsUpdate = true;
  faceTex.repeat.set(p.split.blockW, p.split.blockH);
  faceTex.offset.set(0, 0);                       // v=0 is the image bottom
  const face = new THREE.MeshBasicMaterial({ map:faceTex, transparent:true, alphaTest:0.5 });
  const lr = woodMat(d, bh), tb = woodMat(bw, d), back = woodMat(bw, bh);

  const block = new THREE.Mesh(
    new THREE.BoxGeometry(bw, bh, d),
    [lr, lr, tb, tb, face, back]
  );
  block.position.set(-(W - bw)/2, -(H - bh)/2, 0);   // anchored bottom-left
  g.add(block);

  // hook + line — flat, flush with the block's front face.
  // no alphaTest here: the line is 1–2 antialiased pixels and would shred.
  const topTex = tex.clone(); topTex.needsUpdate = true;
  topTex.repeat.set(1, 1 - p.split.blockH);
  topTex.offset.set(0, p.split.blockH);
  const top = new THREE.Mesh(
    new THREE.PlaneGeometry(W, H - bh),
    new THREE.MeshBasicMaterial({
      map:topTex, transparent:true, depthWrite:false, side:THREE.DoubleSide
    })
  );
  top.position.set(0, bh/2, d/2);
  top.renderOrder = 1;
  g.add(top);

  g.userData.block = block;      // only the block collides
  g.userData.flat = top;
  return g;
}

/* ---------- collision: AABB, rotation-aware ---------- */
const _b = new THREE.Box3();
function boxOf(g) {
  const b = new THREE.Box3().setFromObject(g.userData.block || g);
  b.expandByScalar(-1);          // let edges touch without locking
  return b;
}
function collides(g) {
  const a = boxOf(g);
  for (const o of groups) {
    if (o === g) continue;
    if (a.intersectsBox(boxOf(o))) return true;
  }
  return false;
}
function moveResolved(g, target) {
  const prev = g.position.clone();
  g.position.x = target.x; if (collides(g)) g.position.x = prev.x;
  g.position.y = target.y; if (collides(g)) g.position.y = prev.y;
  if (target.z !== undefined) { g.position.z = target.z; if (collides(g)) g.position.z = prev.z; }
}

/* ---------- input ----------
   1 finger on a piece: move it in the painting plane
   1 finger on the paper: orbit the whole view
   2 fingers on a piece: push it into / pull it out of depth
   2 fingers on the paper (or wheel): zoom
------------------------------------------------------------------ */
const pointers = new Map();
let mode = null, dragG = null, dragOff = new THREE.Vector3();
let pinchStart = 0, pinchBase = 0, lastX = 0, lastY = 0;
const dragPlane = new THREE.Plane();
const hit = new THREE.Vector3();

function ndc(e) {
  return new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
}
function pick(e) {
  raycaster.setFromCamera(ndc(e), camera);
  const hits = raycaster.intersectObjects(meshes, false);
  return hits.length ? hits[0].object.userData.group : null;
}
function planeHit(e, z) {
  dragPlane.set(new THREE.Vector3(0,0,1), -z);
  raycaster.setFromCamera(ndc(e), camera);
  return raycaster.ray.intersectPlane(dragPlane, hit) ? hit.clone() : null;
}
function pinchDist() {
  const p = [...pointers.values()];
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
}

function bindInput() {
  const el = renderer.domElement;
  el.addEventListener("pointerdown", e => {
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    lastX = e.clientX; lastY = e.clientY;

    if (pointers.size === 1) {
      const g = pick(e);
      if (g) {
        mode = "drag"; dragG = g; selected = g; updateSel();
        const h = planeHit(e, g.position.z);
        if (h) dragOff.copy(g.position).sub(h);
      } else {
        mode = "orbit";
      }
    } else if (pointers.size === 2) {
      pinchStart = pinchDist();
      if (mode === "drag" && dragG) { mode = "depth"; pinchBase = dragG.position.z; }
      else { mode = "zoom"; pinchBase = orbit.zoom; }
    }
  });

  el.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if (mode === "drag" && dragG) {
      const h = planeHit(e, dragG.position.z);
      if (h) moveResolved(dragG, h.add(dragOff));
    } else if (mode === "orbit") {
      orbit.theta -= (e.clientX - lastX) * 0.005;
      orbit.phi   -= (e.clientY - lastY) * 0.005;
      orbit.phi = Math.max(0.18, Math.min(Math.PI - 0.18, orbit.phi));
      orbit.theta = Math.max(-1.15, Math.min(1.15, orbit.theta));
    } else if (mode === "depth" && dragG && pointers.size === 2) {
      const f = pinchDist() / pinchStart;
      moveResolved(dragG, { x:dragG.position.x, y:dragG.position.y,
                            z: Math.max(-55, Math.min(260, pinchBase + (f - 1) * 320)) });
    } else if (mode === "zoom" && pointers.size === 2) {
      orbit.zoom = Math.max(0.35, Math.min(2.4, pinchBase / (pinchDist() / pinchStart)));
    }
    lastX = e.clientX; lastY = e.clientY;
  });

  const up = e => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) { mode = null; dragG = null; }
    else if (pointers.size === 1 && (mode === "zoom" || mode === "depth")) mode = null;
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);

  el.addEventListener("wheel", e => {
    e.preventDefault();
    orbit.zoom = Math.max(0.35, Math.min(2.4, orbit.zoom * (1 + e.deltaY * 0.0011)));
  }, { passive:false });

  document.addEventListener("gesturestart", e => e.preventDefault());
}

/* ---------- view ---------- */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const vf = camera.fov * Math.PI / 180;
  const byH = (CONFIG.height / 2) / Math.tan(vf / 2);
  const byW = (CONFIG.width / 2) / Math.tan(vf / 2) / camera.aspect;
  baseDist = Math.max(byH, byW) * 1.06;
  camera.updateProjectionMatrix();
}

function render() {
  const d = baseDist * orbit.zoom;
  camera.position.set(
    d * Math.sin(orbit.phi) * Math.sin(orbit.theta),
    d * Math.cos(orbit.phi),
    d * Math.sin(orbit.phi) * Math.cos(orbit.theta)
  );
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}

function resetView() { orbit.theta = 0; orbit.phi = Math.PI/2; orbit.zoom = 1; }

function toggleFullscreen() {
  const btn = document.getElementById("fsBtn");
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen ||
     document.documentElement.webkitRequestFullscreen).call(document.documentElement);
    btn.textContent = "Exit fullscreen";
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    btn.textContent = "Fullscreen";
  }
}

/* ---------- positioning mode ---------- */
function updateSel() {
  const l = document.getElementById("selLabel");
  if (l) l.textContent = selected ? selected.userData.id : "none selected";
}
function adjustScale(delta) {
  if (!selected) return;
  const u = selected.userData;
  u.scale = Math.max(0.02, u.scale + delta);
  selected.scale.setScalar(u.scale / u.baseScale);
}
function adjustDepth(delta) {
  if (!selected) return;
  const u = selected.userData;
  u.depth = Math.max(4, u.depth + delta);
  const f = u.depth / u.baseDepth;
  u.block.scale.z = f;
  if (u.flat) u.flat.position.z = (u.baseDepth * f) / 2;
}
function rotate90(axis) {
  if (!selected) return;
  selected.rotation[axis] += Math.PI / 2;
}
function exportLayout() {
  const lines = groups.map(g => {
    const u = g.userData, p = CONFIG.pieces.find(c => c.id === u.id);
    const r = a => Math.round(((g.rotation[a] * 180 / Math.PI) % 360 + 360) % 360);
    return '    { id:"' + u.id + '", src:"' + p.src + '", px:[' + p.px[0] + ',' + p.px[1] + '], ' +
      'x:' + (g.position.x + CONFIG.width/2).toFixed(1) + ', ' +
      'y:' + (CONFIG.height/2 - g.position.y).toFixed(1) + ', ' +
      'z:' + g.position.z.toFixed(1) + ', ' +
      'scale:' + u.scale.toFixed(3) + ', ' +
      'rot:[' + r("x") + ',' + r("y") + ',' + r("z") + ']' +
      ', depth:' + Math.round(u.depth) +
      (p.split ? ', split:{ blockW:' + p.split.blockW + ', blockH:' + p.split.blockH + ' }' : '') +
      ' },';
  });
  const out = "pieces: [\n" + lines.join("\n") + "\n  ]";
  const el = document.getElementById("layoutOut");
  el.textContent = out;
  el.classList.add("active");
  if (navigator.clipboard) navigator.clipboard.writeText(out);
}

init();
</script>
</body>
</html>
